// Configuración Gradle del módulo de la aplicación DaySinc (Plugins, SDKs y dependencias).
plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.daysinc'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.daysinc"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Librerías base de UI y compatibilidad Android
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material

    // Google Play Services para Mapas y Ubicación (GPS / Geofencing)
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.1.0'

    // Librería OpenStreetMap (OSMDroid)
    implementation 'org.osmdroid:osmdroid-android:6.1.18'

    // Persistencia local y tareas en segundo plano
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.work:work-runtime:2.9.0'

    // Librerías de Pruebas Unitarias y UI
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}